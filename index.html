<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十三班 · 全国录取地图</title>
<style>
:root{
  --bg:#0b1322; --panel:#111d33; --panel2:#0e1828;
  --ink:#f3ead7; --muted:#8fa2bc;
  --gold:#f0c060; --gold2:#ffdf9e;
  --red:#d8442e; --red-deep:#b02c1f;
  --line:rgba(240,192,96,.18);
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 8% -5%, rgba(176,44,31,.22), transparent 60%),
    radial-gradient(800px 500px at 100% 12%, rgba(240,192,96,.09), transparent 55%),
    radial-gradient(700px 700px at 50% 110%, rgba(30,70,120,.25), transparent 60%),
    var(--bg);}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
             linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:72px 72px;}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* ===== 报头 ===== */
.masthead{position:relative;display:flex;align-items:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap;
  padding:clamp(28px,5vw,56px) 0 clamp(20px,3vw,32px)}
.wm{position:absolute;right:-10px;top:-30px;z-index:0;user-select:none;pointer-events:none;
  font-family:var(--serif);font-weight:900;font-size:clamp(120px,22vw,240px);line-height:1;
  color:transparent;-webkit-text-stroke:1.5px rgba(240,192,96,.13)}
.seal{position:relative;z-index:1;flex:none;width:clamp(64px,9vw,84px);aspect-ratio:1;
  background:linear-gradient(150deg,#e0533c,var(--red-deep));border-radius:8px;transform:rotate(-4deg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 28px rgba(216,68,46,.35), inset 0 0 0 2px rgba(255,255,255,.28);
  animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
.seal::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(255,255,255,.45);border-radius:5px}
.seal b{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;
  font-size:clamp(24px,3.4vw,32px);letter-spacing:.28em;color:#fff7ea;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@keyframes stamp{from{transform:rotate(-14deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.mast-main{position:relative;z-index:1;flex:1 1 320px;min-width:260px}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--gold);font-weight:700;
  display:flex;align-items:center;gap:12px;margin-bottom:10px}
.eyebrow::before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--red),var(--gold))}
.eyebrow em{font-style:normal;color:var(--muted);letter-spacing:.28em}
h1{font-family:var(--serif);font-weight:900;line-height:1.15;font-size:clamp(30px,5.6vw,54px);letter-spacing:.04em}
h1 .accent{color:var(--gold2)}
.lede{margin-top:10px;color:var(--muted);font-size:clamp(13px,1.6vw,15px);letter-spacing:.06em}
.lede i{font-style:normal;color:var(--gold)}
.motto{position:relative;z-index:1;margin-left:auto;writing-mode:vertical-rl;font-family:var(--serif);
  font-weight:800;font-size:clamp(17px,2.4vw,24px);letter-spacing:.5em;color:rgba(240,192,96,.8);
  border-right:2px solid rgba(216,68,46,.6);padding-right:12px;text-shadow:0 0 18px rgba(240,192,96,.25)}
.rule{height:2px;background:linear-gradient(90deg,var(--red),var(--gold) 40%,transparent 90%);border:none}

/* ===== 高校滚动条 ===== */
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.ticker-track{display:flex;width:max-content;animation:tick 38s linear infinite;padding:10px 0}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{font-family:var(--serif);font-size:14px;color:var(--muted);white-space:nowrap;padding:0 18px;letter-spacing:.1em}
.ticker-track span b{color:var(--gold);font-weight:700}
.ticker-track span::after{content:"✦";margin-left:18px;color:rgba(216,68,46,.7);font-size:11px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ===== 区块 ===== */
section{padding:clamp(28px,4.5vw,52px) 0 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h2{font-family:var(--serif);font-weight:800;font-size:clamp(20px,3vw,28px);letter-spacing:.06em;display:flex;align-items:center;gap:14px}
h2 .k{font-size:12px;color:#0b1322;background:var(--gold);font-family:var(--sans);font-weight:700;
  padding:3px 8px;border-radius:3px;letter-spacing:.15em;transform:translateY(-3px)}
.hint{font-size:12px;color:var(--muted);letter-spacing:.08em}

/* ===== 地图 ===== */
.map-panel{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(38,62,102,.35), transparent 60%),
    linear-gradient(160deg,var(--panel),var(--panel2));
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
#map{width:100%;height:clamp(430px,68vh,780px)}
.map-tools{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:8px}
.map-tools button{cursor:pointer;font-family:var(--sans);font-size:12px;letter-spacing:.12em;
  color:var(--gold2);background:rgba(11,19,34,.85);border:1px solid rgba(240,192,96,.4);
  padding:7px 14px;border-radius:999px;transition:.25s}
.map-tools button:hover{background:var(--gold);color:#0b1322;box-shadow:0 0 18px rgba(240,192,96,.45)}
.legend{position:absolute;left:16px;bottom:14px;z-index:5;display:flex;align-items:center;gap:14px;
  font-size:11px;color:var(--muted);background:rgba(11,19,34,.72);padding:8px 14px;border-radius:999px;
  border:1px solid rgba(240,192,96,.18);letter-spacing:.08em}
.legend i{display:inline-block;border-radius:50%;vertical-align:middle;margin-right:5px;
  background:radial-gradient(circle at 35% 35%,#ffe9b8,#e8963c);box-shadow:0 0 8px rgba(240,192,96,.6)}
.map-err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;z-index:4;text-align:center;padding:20px}

/* 地图内名单面板 */
.mpanel{position:absolute;z-index:6;top:16px;right:16px;width:min(300px,80%);max-height:calc(100% - 32px);
  display:flex;flex-direction:column;background:rgba(13,22,40,.97);
  border:1px solid rgba(240,192,96,.45);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.6);
  transform:translateX(26px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1)}
.mpanel.open{transform:none;opacity:1;pointer-events:auto}
.mp-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mp-city{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.14em}
.mp-cnt{font-size:11px;color:#0b1322;background:var(--gold);font-weight:700;padding:2px 8px;border-radius:999px}
.mp-close{margin-left:auto;cursor:pointer;background:none;border:1px solid rgba(240,192,96,.35);
  color:var(--gold2);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;transition:.25s}
.mp-close:hover{background:var(--red);border-color:var(--red);color:#fff;transform:rotate(90deg)}
.mp-schools{padding:8px 16px;font-size:11px;color:var(--muted);line-height:1.7;border-bottom:1px solid var(--line)}
.mp-list{list-style:none;overflow:auto;padding:6px 16px 8px;flex:1}
.mp-list::-webkit-scrollbar{width:5px}
.mp-list::-webkit-scrollbar-thumb{background:rgba(240,192,96,.25);border-radius:3px}
.mp-list li{display:flex;align-items:baseline;gap:8px;padding:7px 0;animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.mp-list b{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.12em;flex:none;color:var(--ink)}
.mp-list .dots{flex:1;border-bottom:1px dotted rgba(143,162,188,.4);transform:translateY(-3px)}
.mp-list span{font-size:12px;color:var(--muted);text-align:right}
.mp-tip{padding:8px 16px 12px;font-size:10px;color:rgba(143,162,188,.6);letter-spacing:.08em}

/* 城市卡片条 */
.city-strip{display:flex;gap:12px;overflow-x:auto;padding:18px 2px 8px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch}
.city-strip::-webkit-scrollbar{height:6px}
.city-strip::-webkit-scrollbar-thumb{background:rgba(240,192,96,.25);border-radius:3px}
.ccard{scroll-snap-align:start;flex:none;width:132px;cursor:pointer;position:relative;
  background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:12px;padding:14px 14px 12px;transition:transform .25s,border-color .25s,box-shadow .25s}
.ccard:hover{transform:translateY(-4px);border-color:rgba(240,192,96,.5);box-shadow:0 12px 26px rgba(0,0,0,.4)}
.ccard.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 26px rgba(240,192,96,.18)}
.ccard .rank{position:absolute;top:10px;right:12px;font-family:var(--serif);font-weight:900;font-size:13px;color:rgba(240,192,96,.55)}
.ccard h4{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:.1em}
.ccard .num{margin-top:6px;font-family:var(--serif);font-weight:900;font-size:26px;color:var(--gold2);line-height:1}
.ccard .num small{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:400;margin-left:3px;letter-spacing:.15em}
.ccard .sub{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.5}

/* ===== 名录 ===== */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.group{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:12px;padding:18px 20px 10px;transition:border-color .3s,transform .3s}
.group:hover{border-color:rgba(240,192,96,.45);transform:translateY(-3px)}
.group header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.group h3{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.14em}
.group .cnt{font-size:11px;color:#0b1322;background:var(--gold);font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.1em}
.group .schools{width:100%;font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.6}
.group ul{list-style:none}
.group li{display:flex;align-items:baseline;gap:10px;padding:9px 4px;border-radius:6px;transition:background .2s}
.group li:hover{background:rgba(240,192,96,.06)}
.group li:hover .stu{color:var(--gold2)}
.stu{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.12em;flex:none;transition:color .2s}
.gdots{flex:1;border-bottom:1px dotted rgba(143,162,188,.4);transform:translateY(-4px)}
.sch{font-size:13px;color:var(--muted);text-align:right;letter-spacing:.03em}

footer{margin-top:clamp(36px,6vw,64px);border-top:1px solid var(--line);padding:22px 0 40px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);letter-spacing:.08em;line-height:1.8}
footer b{color:var(--gold);font-weight:500}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

@media (max-width:760px){
  .motto{display:none}
  .wm{font-size:130px;top:-10px}
  #map{height:clamp(380px,58vh,560px)}
  .legend{display:none}
  .mpanel{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:52%;transform:translateY(26px)}
  .mpanel.open{transform:none}
  .sch{max-width:52%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="wm">13</div>
    <div class="seal"><b>喜报</b></div>
    <div class="mast-main">
      <p class="eyebrow">2023 级 · 十三班 <em>ADMISSION MAP</em></p>
      <h1>全国录取<span class="accent">地图</span></h1>
      <p class="lede">每一份录取通知书，都落在一座真实的城市 · 姓名已以 <i>*</i> 脱敏</p>
    </div>
    <div class="motto">桃李满天下</div>
  </header>
  <hr class="rule">
</div>

<div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="wrap">
  <section>
    <div class="sec-head">
      <h2><span class="k">01</span>录取分布 · 全国地图</h2>
      <span class="hint">滚轮 / 双指缩放 · 拖拽平移 · 悬停标记可预览名单</span>
    </div>
    <div class="map-panel reveal">
      <div class="map-tools"><button id="resetBtn">⟲ 重置视图</button></div>
      <div id="map"></div>
      <div class="map-err" id="mapErr">地图资源加载失败，请检查网络后刷新页面重试</div>

      <div class="mpanel" id="mpanel" aria-live="polite"></div>

      <div class="legend">
        <span><i style="width:8px;height:8px"></i>1 人</span>
        <span><i style="width:14px;height:14px"></i>5 人</span>
        <span><i style="width:22px;height:22px"></i>10 人+</span>
        <span style="opacity:.7">圆点大小 = 录取人数</span>
      </div>
    </div>
    <div class="city-strip" id="cityStrip"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2><span class="k">02</span>同学名录 · 按城市</h2>
      <span class="hint">姓名已脱敏 · 点击地图标记可在地图内直接查看对应名单</span>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <footer>
    <span>数据来源：《13班录取结果》 · 城市位置按各市人民政府驻地坐标标注</span>
    <span><b>注</b> · 姓名已脱敏处理 · 地图需联网加载</span>
  </footer>
</div>

<script>
/* ================= 数据（姓名已脱敏） ================= */
const CITIES = [
 {name:'北京', coord:[116.4074,39.9042], pos:'right', students:[
   ['李*琛','北京师范大学'],['梁*迪','中国科学院大学'],['廖*天','北京邮电大学'],['林*烨','北京理工大学'],
   ['刘*霖','北京大学'],['刘*量','清华大学'],['罗*杰','北京大学'],['骆*霖','北京航天航空大学'],
   ['吕*迈','清华大学'],['吴*锴','中国人民大学'],['袁*涵','中国社会科学院大学'],['蒋*希','北京理工大学']]},
 {name:'深圳', coord:[114.0579,22.5431], pos:'right', students:[
   ['刘*杰','哈尔滨工业大学'],['刘*语','中山大学'],['陆*玮','深圳理工大学'],['张*恺','天津大学香港理工大学'],
   ['张*玮','中山大学'],['赵*扬','哈尔滨工业大学'],['陈*恒','深圳大学'],['黄*林','中山大学']]},
 {name:'广州', coord:[113.2644,23.1291], pos:'left', students:[
   ['罗*严','中山大学'],['孙*阳','中山大学'],['唐*淳','华南理工大学'],['丁*毓','中山大学'],
   ['黄*丹','中山大学'],['孔*龙','华南理工大学']]},
 {name:'珠海', coord:[113.5767,22.2710], pos:'left', students:[
   ['李*涵','中山大学'],['李*睿','中山大学'],['徐*杰','北京师范大学'],['卓*皓','中山大学'],['邓*宇','中山大学']]},
 {name:'成都', coord:[104.0668,30.5728], pos:'left', students:[
   ['刘*言','四川大学'],['曾*杰','电子科技大学'],['何*越','电子科技大学']]},
 {name:'上海', coord:[121.4737,31.2304], pos:'right', students:[
   ['熊*轩','同济大学'],['程*','复旦大学'],['金*仪','同济大学']]},
 {name:'合肥', coord:[117.2272,31.8206], pos:'right', students:[
   ['赖*旭','中国科学技术大学'],['彭*德','中国科学技术大学']]},
 {name:'武汉', coord:[114.3055,30.5928], pos:'left', students:[
   ['鲁*文','华中科技大学'],['赵*鹏','华中科技大学']]},
 {name:'杭州', coord:[120.1551,30.2741], pos:'bottom', students:[
   ['杨*淞','浙江大学'],['朱*鹤','西湖大学']]},
 {name:'沈阳', coord:[123.4315,41.8057], pos:'right', students:[['李*桦','东北大学']]},
 {name:'长沙', coord:[112.9388,28.2282], pos:'left', students:[['曾*秋','湖南大学']]},
 {name:'西安', coord:[108.9398,34.3416], pos:'left', students:[['何*欢','西安交通大学']]},
 {name:'澳门', coord:[113.5439,22.1987], pos:'bottom', students:[['黄*桢','澳门大学']]}
];
const cityByName = {}; CITIES.forEach((c,i)=>{c.idx=i; cityByName[c.name]=c;});
const PRD = ['广州','深圳','珠海','澳门'];                 // 珠三角需更大缩放
const DEFAULT_VIEW = {center:[106.8,33.6], zoom:1.18};

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function schoolSummary(c){
  const m={}; c.students.forEach(s=>m[s[1]]=(m[s[1]]||0)+1);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=> v>1?`${k} ×${v}`:k).join(' · ');
}

/* ================= 高校滚动条 ================= */
(function(){
  const m={}; CITIES.forEach(c=>c.students.forEach(s=>m[s[1]]=(m[s[1]]||0)+1));
  const html = Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${k} <b>×${v}</b></span>`).join('');
  $('#tickerTrack').innerHTML = html + html;
})();

/* ================= 城市卡片 ================= */
(function(){
  const sorted=[...CITIES].sort((a,b)=>b.students.length-a.students.length);
  $('#cityStrip').innerHTML = sorted.map((c,i)=>`
    <div class="ccard" data-city="${c.name}" tabindex="0">
      <span class="rank">${String(i+1).padStart(2,'0')}</span>
      <h4>${c.name}</h4>
      <div class="num">${c.students.length}<small>人</small></div>
      <div class="sub">${new Set(c.students.map(s=>s[1])).size} 所高校</div>
    </div>`).join('');
})();

/* ================= 名录 ================= */
(function(){
  const sorted=[...CITIES].sort((a,b)=>b.students.length-a.students.length);
  $('#groups').innerHTML = sorted.map(c=>`
    <article class="group reveal" data-city="${c.name}">
      <header>
        <h3>${c.name}</h3><span class="cnt">${c.students.length} 人</span>
        <p class="schools">${schoolSummary(c)}</p>
      </header>
      <ul>${c.students.map(s=>`
        <li><span class="stu">${s[0]}</span><span class="gdots"></span><span class="sch">${s[1]}</span></li>`).join('')}
      </ul>
    </article>`).join('');
})();

/* ================= 滚动出场 ================= */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ================= 名单面板（地图内） ================= */
const panel=$('#mpanel');
let openCity=null;

function openPanel(name){
  const c=cityByName[name]; openCity=name;
  panel.innerHTML=`
    <div class="mp-head">
      <span class="mp-city">${c.name}</span><span class="mp-cnt">${c.students.length} 人</span>
      <button class="mp-close" aria-label="关闭">×</button>
    </div>
    <div class="mp-schools">${schoolSummary(c)}</div>
    <ul class="mp-list">${c.students.map((s,i)=>`
      <li style="animation-delay:${i*40}ms"><b>${s[0]}</b><span class="dots"></span><span>${s[1]}</span></li>`).join('')}
    </ul>
    <div class="mp-tip">再次点击该城市标记或按 Esc 收起</div>`;
  panel.querySelector('.mp-close').addEventListener('click',closePanel);
  panel.classList.add('open');
  document.querySelectorAll('.ccard').forEach(el=>el.classList.toggle('active',el.dataset.city===name));
  if(chart) chart.dispatchAction({type:'highlight',seriesIndex:0,dataIndex:c.idx});
}
function closePanel(){
  if(openCity===null) return;
  const c=cityByName[openCity];
  openCity=null; panel.classList.remove('open');
  document.querySelectorAll('.ccard').forEach(el=>el.classList.remove('active'));
  if(chart&&c) chart.dispatchAction({type:'downplay',seriesIndex:0,dataIndex:c.idx});
}
function toggleCity(name){
  if(chart) chart.dispatchAction({type:'hideTip'});
  if(openCity===name){ closePanel(); return; }
  if(openCity!==null) closePanel();
  openPanel(name); focusCity(name);
}
function focusCity(name){
  if(!chart) return;
  const c=cityByName[name], prd=PRD.includes(name), mob=innerWidth<760;
  const Z=prd?6.5:4.2;
  const latOff=mob?(prd?0.9:1.4):0;   // 手机端把城市抬高，避开底部面板
  chart.setOption({geo:{center:[c.coord[0], c.coord[1]-latOff], zoom:Z}});
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

/* ================= 地图（ECharts 在线版） ================= */
let chart = null;

// 使用更简单的函数来加载脚本
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// 主函数
(async function() {
  try {
    // 1. 加载 ECharts 库
    if (!window.echarts) {
      // 使用国内更稳定的 CDN
      await loadScript('https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js');
    }
    
    // 2. 加载本地地图数据
    // 确保 china.json 和 index.html 在同一目录
    const response = await fetch('china.json');
    if (!response.ok) {
      throw new Error(`无法加载地图数据，状态码: ${response.status}`);
    }
    const geo = await response.json();

    // 3. 注册地图并初始化
    echarts.registerMap('china', geo);
    initMap();

  } catch (e) {
    console.error('地图加载失败:', e); // 在控制台打印更详细的错误
    $('#mapErr').style.display = 'flex';
  }
})();
  }catch(e){ fail(); }
})();

function initMap(){
  chart = echarts.init($('#map'));
  const data = CITIES.map(c=>({
    name:c.name, value:[...c.coord, c.students.length],
    label:{position:c.pos}
  }));
  chart.setOption({
    backgroundColor:'transparent',
    geo:{
      map:'china', roam:true, zoom:DEFAULT_VIEW.zoom, center:DEFAULT_VIEW.center,
      scaleLimit:{min:.7,max:14},
      itemStyle:{areaColor:'#16273f', borderColor:'#41639a', borderWidth:.7,
                 shadowColor:'rgba(0,0,0,.5)', shadowBlur:14, shadowOffsetY:6},
      emphasis:{itemStyle:{areaColor:'#1e3354'}, label:{show:false}},
      select:{itemStyle:{areaColor:'#1e3354'}, label:{show:false}}
    },
    tooltip:{
      trigger:'item', confine:true,
      backgroundColor:'rgba(13,22,40,.96)', borderColor:'rgba(240,192,96,.4)', borderWidth:1,
      padding:[10,14], extraCssText:'box-shadow:0 14px 34px rgba(0,0,0,.55);border-radius:10px;',
      formatter:p=>{
        const c=cityByName[p.name]; if(!c) return '';
        const rows=c.students.slice(0,5).map(s=>`<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('');
        return `<div class="tt"><h4>${c.name}<em>${c.students.length} 人</em></h4><ul>${rows}</ul>
          ${c.students.length>5?`<p class="more">+${c.students.length-5} 位同学</p>`:''}</div>`;
      }
    },
    series:[{
      type:'effectScatter', coordinateSystem:'geo', data, zlevel:2,
      showEffectOn:'emphasis',
      rippleEffect:{brushType:'stroke', scale:3.4, period:4.5},
      symbolSize:v=>10+v[2]*1.9,
      itemStyle:{
        color:new echarts.graphic.RadialGradient(.35,.35,.8,[
          {offset:0,color:'#ffe6ac'},{offset:.55,color:'#f0c060'},{offset:1,color:'#d97b2a'}]),
        borderColor:'#fff3d6', borderWidth:1, opacity:.94,
        shadowColor:'rgba(240,192,96,.85)', shadowBlur:12
      },
      label:{
        show:true, formatter:'{b}', color:'#f6e7c4', fontSize:12, fontWeight:600,
        textBorderColor:'rgba(8,14,26,.9)', textBorderWidth:2, distance:6
      },
      emphasis:{itemStyle:{shadowBlur:24}}
    }]
  });

  /* 点击城市圆点 → 地图内展开 / 收起名单；点击空白 → 收起 */
  chart.on('click', p=>{
    if(p.componentType==='series') toggleCity(p.name);
    else closePanel();
  });

  window.addEventListener('resize', ()=>chart.resize());
}

/* 城市卡片 → 聚焦并展开名单 */
document.querySelectorAll('.ccard').forEach(el=>{
  el.addEventListener('click', ()=>{
    toggleCity(el.dataset.city);
    if(innerWidth<760) $('#map').scrollIntoView({behavior:'smooth',block:'start'});
  });
  el.addEventListener('mouseenter', ()=>chart&&chart.dispatchAction({type:'highlight',seriesIndex:0,dataIndex:cityByName[el.dataset.city].idx}));
  el.addEventListener('mouseleave', ()=>chart&&chart.dispatchAction({type:'downplay',seriesIndex:0,dataIndex:cityByName[el.dataset.city].idx}));
});

/* 重置视图 */
$('#resetBtn').addEventListener('click', ()=>{
  closePanel();
  if(!chart) return;
  chart.setOption({geo:{center:DEFAULT_VIEW.center, zoom:DEFAULT_VIEW.zoom}});
  chart.dispatchAction({type:'hideTip'});
});
</script>
</body>
</html>
